# Composite setup kept only for release.yml, which this sweep doesn't edit (it
# belongs to the release session): ci.yml and devcontainer.yml call
# `voidzero-dev/setup-vp` directly. Delete this directory, and its entry in
# .github/dependabot.yml, once release.yml does the same.
# One action, `voidzero-dev/setup-vp` (#254), replaces pnpm/action-setup and
# actions/setup-node: it installs the Vite+ CLI at the catalog's `vite-plus`
# pin (`version-file`), a managed Node.js, and the pnpm `packageManager`
# names, restores the pnpm store cache keyed on pnpm-lock.yaml, and installs
# dependencies (`vp install`; pnpm freezes the lockfile by default in CI), so a drift fails
# here rather than shipping. Later steps keep calling `pnpm exec vp …` and
# `pnpm run …`: the managed pnpm is on PATH.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, and install dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        # The catalog pin, so CI runs the same Vite+ the lockfile installs.
        version-file: pnpm-workspace.yaml
        # Never a moving pre-release: `lts` is the newest LTS release, which
        # is inside package.json `engines` (>=22). (setup-node's `latest`
        # once resolved to `v27.0.0-alpha`, #225, effect-svelte#214.)
        node-version: "lts"
        cache: true
