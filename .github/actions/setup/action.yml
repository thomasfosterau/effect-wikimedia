# Composite setup shared by every job that needs the toolchain (copied in
# shape from `thomasfosterau/effect-drizzle-ext`, the Vite+ library standard).
# Sets up pnpm + Node.js, restores the pnpm store cache (keyed on
# pnpm-lock.yaml by setup-node), and installs dependencies with a FROZEN
# lockfile, so a manifest/lockfile drift fails here rather than shipping.
# `vp` (vite-plus is a devDependency) lands in node_modules/.bin; later steps
# call it as `pnpm exec vp …` rather than through a `GITHUB_PATH` write
# (zizmor flags those) — no separate Vite+ installer action, and one fewer
# third-party action to pin.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up pnpm and Node.js, restore the package cache, and install dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: latest
        cache: pnpm

    # `--frozen-lockfile`: the committed pnpm-lock.yaml is the dependency tree
    # CI verifies; an out-of-sync lockfile fails the install instead of being
    # silently re-resolved. Dependency build scripts are already gated by
    # `allowBuilds` in pnpm-workspace.yaml.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
