# Dependabot version-update configuration (a subset of the
# `thomasfosterau/effect-drizzle-ext` one, the shared library standard).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set; the vitest toolchain is pinned to
# vite-plus's exact versions (see the catalog in pnpm-workspace.yaml).
#
# `vite` is an npm alias of `@voidzero-dev/vite-plus-core`, `vitest` must
# match vite-plus's exact pin, and `@vitest/coverage-istanbul` peers on that
# exact `vitest`, so their *version* updates are ignored (bump the four
# together by editing the catalog) while SECURITY updates stay enabled: each
# ignore is scoped to the `version-update:semver-*` update types; a bare
# `dependency-name` ignore would block security updates too.
#
# `@effect/tsgo`, `typescript` (the TS6 alias) and `@typescript/native` (TS7)
# are one set: `effect-tsgo patch` matches the installed TypeScript by gitHead
# and hard-errors (UnsupportedTargetPackageVersionError) on any pairing it has
# no artifact for, so a PR that moves one of them alone goes red. Their
# *version* updates are ignored the same way (security updates stay enabled);
# bump the three by hand as a set, together with `vite-plus` (whose tsgolint
# is built against a TypeScript version), after checking the `components`
# table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs. `@effect/tsgo` is
# excluded from the `effect` group, whose `@effect/*` pattern would match it.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`, so Dependabot
# never proposes a version pnpm's own supply-chain gate would reject.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/coverage-istanbul"
          - "vite-plus"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
