# Dependabot version updates (the shape the @thomasfosterau family shares).
#
# The `npm` ecosystem at `/` reads pnpm-workspace.yaml's catalogs and
# pnpm-lock.yaml. `groups` hold the sets that MUST move together, so a
# lockstep set arrives as one PR (every update type, majors included) and can
# never drift one package at a time. Dependabot puts a dependency in the FIRST
# group that matches, so the groups run specific → general, with
# `exclude-patterns` keeping a package out of a broader group:
#
# - `toolchain`: `effect-tsgo patch` (the `prepare` script) matches the
#   installed `tsc`, `oxlint` and `oxlint-tsgolint` by gitHead and hard-errors
#   (UnsupportedTargetPackageVersionError) on any pairing it has no build for,
#   failing `pnpm install` itself; `vite-plus` pins the oxlint, oxfmt,
#   tsgolint and vitest it carries, `vite` is its core under an alias,
#   `vitest` must equal its pin, and `@vitest/coverage-istanbul` peers on that
#   exact `vitest`. The effect lint plugin loads inside that oxlint. Before
#   merging a toolchain PR, check the `components` table in
#   node_modules/@effect/tsgo/dist/effect-tsgo.cjs (see the catalog comments).
# - `effect`: the Effect release line is a lockstep, singleton set.
# - `typedoc`, `fallow`, `changesets`: each tool's own packages.
# - `minor-and-patch`: everything else, minor and patch only, so PR volume
#   stays low; a major outside the sets above stays its own PR.
#
# Catalog entries Dependabot may not bump on its own (npm aliases: `vite` →
# `@voidzero-dev/vite-plus-core`, `typescript` → `@typescript/typescript6`,
# `@typescript/native` → `typescript`) are by-hand steps with their group;
# AGENTS.md lists them. The `overrides` in pnpm-workspace.yaml are all
# `catalog:`, so they follow the catalog and need no bump of their own.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), with
# `@thomasfosterau/*` exempt as `minimumReleaseAgeExclude` is, so Dependabot
# never proposes a version pnpm's own supply-chain gate would reject.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      typedoc:
        applies-to: version-updates
        patterns:
          - "typedoc"
          - "typedoc-plugin-*"
          - "@microsoft/tsdoc*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
          - "@fallow-cli/*"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
