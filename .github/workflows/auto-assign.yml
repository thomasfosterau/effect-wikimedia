name: Auto-assign

# Assigns the owner to every pull request when it opens, reopens or leaves
# draft, unless it already has an assignee. `pull_request` (never
# `pull_request_target`): the job runs no code from the PR, checks nothing
# out and uses no third-party action, so the only input it reads is the PR's
# own URL, passed through `env:` rather than interpolated into the script.
#
# Dependabot's PRs are skipped: a Dependabot-triggered `pull_request` run gets
# a read-only token, so the edit would fail; `.github/dependabot.yml`
# assigns those itself (`assignees`). The "chore: version packages" PR is
# opened by the Release workflow with `GITHUB_TOKEN`, whose events trigger no
# other workflow, so it is not assigned here either.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  assign:
    if: github.actor != 'dependabot[bot]' && toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
