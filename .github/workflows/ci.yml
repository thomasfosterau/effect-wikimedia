name: CI

# ONE job, ONE required check (copied in shape from
# `thomasfosterau/effect-drizzle-ext`, the Vite+ library standard). The
# repo's task graph lives in vite.config.ts, not in GitHub Actions `needs:`.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # `vp run` tasks (`check`, `fallow`, `test:unit`, `fallow:health`,
      # `build`, `check:dist`, `docgen`) are content-addressed (`run.cache` in vite.config.ts);
      # restoring the cache lets an unchanged task replay.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      # Vite+'s built-in `vp check`, not the `check` task below.
      - name: Format, lint and type-check
        run: vp check

      # `vp check` type-checks with tsgolint, which reports no Effect
      # diagnostics. The `check` task runs `tsc -p tsconfig.json` with the
      # native `tsc` that `prepare` patches with `effect-tsgo`, so this step is
      # the one that fails on an Effect `error` diagnostic; warnings and
      # suggestions don't affect its exit code
      # (`ignoreEffectWarningsInTscExitCode` in tsconfig.json) (#31, #20).
      - name: Effect diagnostics
        run: vp run check

      # fallow's dead-code analysis: fails on an unused file, export, type,
      # devDependency or catalog entry, a duplicate export, an unresolved
      # import or a circular dependency (`.fallowrc.json` holds the entry
      # points and the documented exemptions) (#20). Then its duplication
      # analysis: fails on a clone group not in `duplicates.ignoredClones`
      # (#102). Like the two steps above it reads only the source tree and
      # needs no build, and it takes well under a second, so it runs with the
      # static checks, before the tests.
      - name: Dead code and duplication
        run: vp run fallow

      # Also writes coverage/coverage-final.json for the complexity step.
      - name: Test
        run: vp run test:unit

      # fallow's complexity analysis: fails on a function over a cyclomatic,
      # cognitive or CRAP ceiling (`health` in `.fallowrc.json`: the defaults,
      # and today's value for each function already over one) (#102). CRAP is
      # computed from the Test step's coverage, so it runs straight after it;
      # its `test:unit` dependency replays from that step's cache entry.
      - name: Complexity
        run: vp run fallow:health

      - name: Build
        run: vp run build

      # Type-checks `tests/dist-consumer/` against the emitted `dist/*.d.ts`
      # with `skipLibCheck: false`, as a consumer's compiler sees the published
      # package, so broken declarations fail here even when the source
      # type-check passes (#20). Its `build` dependency replays from the step
      # above.
      - name: Dist-consumer declaration check
        run: vp run check:dist

      # Renders the API reference from the doc comments with TypeDoc and fails
      # on an undocumented export or a `{@link}` that resolves to nothing in the
      # published surface (`typedoc.json`'s validation, warnings as errors)
      # (#20). It reads `src/` and needs no build; it sits after the
      # declaration check with the other published-surface gates, and the
      # audit stays last as the one step that needs the npm registry.
      - name: API docs
        run: vp run docgen

      - name: Audit
        run: pnpm audit --audit-level high
