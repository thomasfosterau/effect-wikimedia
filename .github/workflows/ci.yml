name: CI

# One workflow whose only command is `vp run ci`: the `ci` task in
# vite.config.ts runs every gate in order (AGENTS.md "Verification"), so CI
# and a local `vp run ci` are the same thing. It runs on the LTS and the
# Current release lines of Node.js. The task graph lives in vite.config.ts,
# not in GitHub Actions steps or `needs:`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only read access. Nothing here
# needs a secret, so a Dependabot PR runs it exactly as any other PR does.
permissions: {}

jobs:
  test:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `lts` is the active LTS line. The Current line is pinned by major,
        # not given as `latest`: `vp env use latest` resolves pre-releases
        # (v27.0.0-alpha on 2026-11-12), and CI must test a released line.
        # Today the Current line is 26, the same as `lts`; move this to 27
        # once Node.js 27 is released. Both satisfy `engines.node` (>=22).
        node: [lts, "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ at the catalog pin, the matrix's Node.js, the `packageManager`
      # pnpm, the pnpm store cache, and `vp install` (#254); pnpm installs with
      # a frozen lockfile in CI, so a manifest/lockfile drift fails here.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true

      # The `vp run` tasks are content-addressed (`run.cache` in
      # vite.config.ts); restoring the cache lets an unchanged task replay.
      # Keyed per Node.js line, since a task's output can depend on it.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install
        run: vp install --frozen-lockfile

      - name: Print the Node.js version
        run: node --version

      - name: Run every gate
        run: vp run ci

  # One stable check name for rulesets, whatever the matrix holds.
  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every matrix run passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
