name: CI

# ONE job, ONE required check (copied in shape from
# `thomasfosterau/effect-drizzle-ext`, the Vite+ library standard). The
# repo's task graph lives in vite.config.ts, not in GitHub Actions `needs:`.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # `vp run` tasks (`test`, `build`) are content-addressed (`run.cache` in
      # vite.config.ts); restoring the cache lets an unchanged task replay.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format, lint and type-check
        run: vp check

      # `vp check` type-checks with tsgolint, which reports no Effect
      # diagnostics. `prepare` patches the native `tsc` (`@typescript/native`)
      # with `effect-tsgo`, so this step is the one that fails on an Effect
      # `error` diagnostic; warnings and suggestions don't affect its exit
      # code (`ignoreEffectWarningsInTscExitCode` in tsconfig.json) (#31).
      - name: Effect diagnostics
        run: tsc -p tsconfig.json

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      - name: Audit
        run: pnpm audit --audit-level high
