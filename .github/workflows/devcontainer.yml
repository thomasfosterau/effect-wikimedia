name: Dev Container

# Builds and starts .devcontainer/ the way Codespaces does, then checks that
# the container is provisioned.

on:
  pull_request:
    branches: [trunk]
    paths:
      - ".devcontainer/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [trunk]
    paths:
      - ".devcontainer/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  devcontainer:
    name: build and provision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only to run the CLI on the runner; the container installs its own.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: false
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder . --log-level info
      - name: Assert the container is provisioned
        run: |
          run() { vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc "$1"; }
          set -x
          run 'vp --version'
          run 'node --version'
          run 'test -d node_modules/.pnpm && test -x node_modules/.bin/vp'
          run 'gh --version'
          run 'rg --version'
          run 'jq --version'
          run 'claude --version'
