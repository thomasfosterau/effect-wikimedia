name: Release

# Changesets: `version` opens the "chore: version packages" PR; `publish` (the
# only job with `id-token: write`, in the protected `release` environment)
# publishes via npm trusted publishing. Nothing runs unless actions.lock verifies.
# Privileged jobs skip the package cache and lifecycle scripts.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions: {}

jobs:
  verify-lockfile:
    if: github.repository == 'thomasfosterau/effect-wikimedia' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  select:
    name: Select mode
    needs: verify-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    env:
      # Otherwise pnpm may re-install with lifecycle scripts before a
      # `pnpm run`, undoing `--ignore-scripts` in a job holding `id-token`.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Publish
        uses: changesets/action/publish@v2.1.2
        with:
          script: vp run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
