name: Release

# Changesets release flow (copied from `thomasfosterau/effect-jsonapi`, the
# release-pipeline standard): on every push to `trunk`, changesets/action
# either opens/updates the "Version Packages" PR (while unreleased changesets
# exist) or, once that PR has merged and no changesets remain, publishes to
# npm and tags the release. See docs/RELEASING.md.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-wikimedia'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires manual approval via a protected GitHub Environment named
    # "release". See docs/RELEASING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version branch, the release tag and the GitHub release
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # `changeset publish` runs `pnpm publish`, which rewrites the
      # `catalog:` / `catalog:peers` specifiers into real ranges and, under
      # pnpm 11 (`packageManager`), performs the npm trusted-publishing (OIDC)
      # exchange itself via the `id-token` permission above. This upgrade
      # predates that and may now be redundant (#22). It is pinned to a major
      # rather than `@latest` because this job holds `id-token: write`: a new
      # npm major is a reviewed bump here, not something the job picks up.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11

      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`. The action parses the "New tag:" output of
      # `changeset publish`, pushes the tag and creates the GitHub release.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          # `pnpm run`, NOT `vp run`: pnpm forwards the ambient environment to
          # child processes, whereas `vp run` does not propagate the
          # `ACTIONS_ID_TOKEN_REQUEST_URL` / `_TOKEN` variables npm needs for
          # OIDC. Without them npm logs "oidc Skipped because incorrect
          # permissions for id-token", falls back to token auth and fails with
          # ENEEDAUTH. The `release` script still builds with `vp` internally.
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publishing authenticates via OIDC trusted publishing
          # (the `id-token: write` permission above + a trusted publisher
          # configured for the package on npmjs.com).
          # Don't force provenance; npm attaches it itself when allowed, and an
          # explicit request fails from a private repository.
