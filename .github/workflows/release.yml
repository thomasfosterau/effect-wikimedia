name: Release

# Changesets, split so only publishing waits for approval: `select` picks the
# mode, `version` opens the "chore: version packages" PR, and `publish` (the
# only job in the protected `release` environment, and the only one with
# `id-token: write`) publishes via npm trusted publishing. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions: {}

jobs:
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-wikimedia' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    env:
      # Otherwise pnpm 11 may re-install with lifecycle scripts before a
      # `pnpm run`, undoing `--ignore-scripts` in a job holding `id-token`.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # No package cache: a cache another workflow wrote must never feed a
      # job holding `id-token: write`.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Publish
        uses: changesets/action/publish@v2.1.2
        with:
          script: vp run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
