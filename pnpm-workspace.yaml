# Every external version lives here (`catalogMode: strict`); package.json
# references only `catalog:` and `catalog:peers`. After editing, run
# `vp install` and commit pnpm-lock.yaml.
catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.4
  "@effect/language-service": ^0.87.3
  # Test-only (`NodeServices.layer`); moves with `effect`.
  "@effect/platform-node": 4.1.5
  # `effect-tsgo patch` (the `prepare` script) supports only the TypeScript,
  # oxlint and tsrs versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails `vp install`
  # on any other. Moves with `@typescript/native` and `vite-plus`.
  "@effect/tsgo": 0.73.4
  "@enfect/oxlint": 0.10.0
  "@effect/vitest": 4.1.5
  "@types/node": ^26.1.2
  "@types/unbzip2-stream": ^1.4.3
  # Must equal the vitest that vite-plus bundles.
  "@vitest/coverage-istanbul": 5.1.1
  effect: 4.1.5
  # Both minors pass the gates, so an app on either dedupes to one copy.
  "@thomasfosterau/effect-parse": ^0.5.0 || ^0.6.0
  esbuild: ^0.28.1
  fallow: 3.48.0
  # Runs on the TS6 JS API (the `typescript` alias below).
  typedoc: ^0.28.20
  # TypeScript 6/7 side by side: JS-API consumers (the language service,
  # TypeDoc, `vp pack`'s declaration bundler) need TS6 as `typescript` (bin
  # `tsc6`); `@typescript/native` is TS7 (bin `tsc`), patched by @effect/tsgo.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # Test-only: proves the bzip2 recipe in docs/dumps.md streams end to end.
  unbzip2-stream: ^1.4.3
  # `vite` and `vitest` must equal what vite-plus itself depends on
  # (`npm view vite-plus@<v> dependencies`); `vite` no longer equals vite-plus.
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.2

# The published peer ranges: `effect ^4.0.0`, raised only when a dependency
# requires more.
catalogs:
  peers:
    effect: ^4.0.0

overrides:
  # Two copies of `effect` break `Context` / `Layer` / `Schema` identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  # tests/tree-shaking.test.ts runs a real esbuild bundle.
  esbuild: true
  msgpackr-extract: false

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

# Hold new versions for 24 hours, matching Dependabot's 1-day cooldown.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
