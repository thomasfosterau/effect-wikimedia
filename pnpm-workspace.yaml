# Single-package repository — the library lives at the repo root, so there is
# no `packages:` list. This file carries the pnpm settings (pnpm 10+ reads them
# from here rather than `.npmrc`) and the dependency catalog.
#
# EVERY external dependency version lives in the catalog below; package.json
# references only `catalog:` (dev) and `catalog:peers` (the published peer
# range). `catalogMode: strict` makes `pnpm add` enforce that at add time and
# `pnpm install` reject a non-catalog specifier. After editing the catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once (`pnpm install --frozen-lockfile`).
#
# The shape (strict catalog, `catalogs: peers`, singleton overrides, release
# age) is the shared library standard, copied from
# `thomasfosterau/effect-drizzle-ext`.
catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary: the TS7 side of
  # the 6/7 split. `effect-tsgo patch --typescript` (the root `prepare` script)
  # overwrites the native `tsc` binary with an Effect-patched build matched by
  # gitHead, so this pins in lockstep with `@typescript/native` below. Each
  # release ships artifacts for an explicit set of component versions and
  # hard-errors (UnsupportedTargetPackageVersionError) on anything else, failing
  # `pnpm install` itself: read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping either.
  # `prepare` also patches oxlint (`--oxlint`), which loads the
  # `@effect/tsgo/oxlint-presets` rules in `vp check`, so this release must also
  # list the `oxlint` and `oxlint-tsgolint` that `vite-plus` pins: 0.63.0 ships
  # TypeScript 7.0.2, oxlint 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005,
  # and vite-plus 1.4.0 carries oxlint 1.89.0 and tsgolint 7.0.2004. Bump
  # `@effect/tsgo`, `@typescript/native` and `vite-plus` together.
  "@effect/tsgo": 0.63.0
  # The Effect lint rules `vp check` runs (`effect.configs.recommended` in
  # vite.config.ts, every rule under the `effect/` namespace; it replaced
  # `@mpsuesser/oxlint-plugin-effect`, #221). It depends on `effect` 4.1.0
  # exactly, but the `effect` singleton override below loads our pin in its
  # place, and it lints fine on that. It loads inside the oxlint `vite-plus`
  # carries, so it moves with the `toolchain` group.
  "@enfect/oxlint": 0.9.0
  "@types/node": ^26.1.2
  # Types for `unbzip2-stream` below (test-only). They describe its stream as a
  # `stream.Transform`, which it isn't: see that entry.
  "@types/unbzip2-stream": ^1.4.3
  # Vitest's Istanbul coverage provider, which `vp run test:unit` loads to write
  # coverage/coverage-final.json for the coverage-backed CRAP scores in `vp run
  # fallow:health` (#102). It peers on vitest at the exact version, so it moves
  # with `vite-plus` / `vite` / `vitest` (see the comment on those below).
  "@vitest/coverage-istanbul": 5.0.5
  # `effect` is a peerDependency of the published package and a devDependency
  # here, so the repo resolves exactly one copy while consumers bring their
  # own. Two copies break `Context` / `Layer` / `Schema` identity at runtime.
  #
  # The stable 4.0.0 release (website#2059). The published peer floor in
  # `catalogs.peers` is `>=4.0.0` (#167), the floor effect-parse peers on.
  effect: 4.0.4
  # The parser-combinator library the `Wikitext` parser is written in (#168):
  # the package's one runtime dependency besides the `effect` peer, which it
  # shares. First-party, so `minimumReleaseAgeExclude` lets a new release in
  # at once. Its own `effect` peer (`^4.0.0`) sets our peer floor (#167).
  "@thomasfosterau/effect-parse": ^0.3.0
  # The tree-shaking test (`tests/tree-shaking.test.ts`) drives esbuild directly.
  esbuild: ^0.28.1
  # The dead-code, duplication and complexity gates (`vp run fallow` and `vp
  # run fallow:health`, #20, #102): fallow's static analysis reports unused
  # files, exports, types and dependencies, duplicate exports, circular
  # imports, clone groups and over-complex functions, configured in
  # `.fallowrc.json`. A native (Rust) binary, delivered through per-platform
  # `@fallow-cli/*` optional dependencies, with no install script. At least
  # 3.33.1: 3.32.0 gave nearly every clone group the same fingerprint (a rank
  # suffix told them apart), so a `duplicates.ignoredClones` entry could hide
  # a different clone (#102). Exact, like the rest of the family: the
  # PreToolUse fallow gate (`.claude/hooks/fallow-gate.sh`) and CI must agree on
  # what a finding is.
  fallow: 3.37.0
  # The docs gate (`vp run docgen`, #20): TypeDoc renders the API reference from
  # the doc comments reachable from `src/index.ts` and, under `typedoc.json`'s
  # validation, fails on an undocumented export or an unresolved `{@link}`.
  # TypeDoc runs on the TS6 JS API (the `typescript` alias below); check its
  # `typescript` peer range before bumping either.
  typedoc: ^0.28.20
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, the tsdown
  # declaration bundler behind `vp pack`) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # Test-only: the bzip2 decoder the `Dumps` docs recommend for Wikidata's
  # `.json.bz2` dumps, so tests/dumps/sources.test.ts can prove that recipe
  # streams end to end (#128). Pure JS, MIT, no install scripts; its stream
  # is a classic `through` stream, not a streams2 `Transform`, which
  # `src/dumps/sources.ts` adapts before `stream.compose`. Never a runtime
  # dependency: callers bring their own decoder.
  unbzip2-stream: ^1.4.3
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override below
  # forces every resolution to the catalog singleton. Bump the three together,
  # with `@vitest/coverage-istanbul` above, which peers on that exact `vitest`.
  # 1.4.0 carries oxlint 1.89.0, oxfmt 0.74.0, tsgolint 7.0.2004 and vitest
  # 5.0.5.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.4` peer would reject a consumer on another 4.x release). The floor is
# 4.0.0, the `effect` peer of `@thomasfosterau/effect-parse` (#167).
# `pnpm publish` (which `changeset publish` runs) replaces `catalog:peers`
# with these ranges in the published manifest.
catalogs:
  peers:
    effect: ">=4.0.0"

overrides:
  # `effect` MUST be a singleton (see the catalog comment): force every
  # resolution to the catalog version so a hoisting reshuffle cannot introduce
  # a second copy.
  effect: "catalog:"
  # `vite@*` / `vitest@*` are the keys `vp migrate` manages under pnpm.
  vite@*: "catalog:"
  vitest@*: "catalog:"
# vitest declares a peer on `vite` by its public version range, which the
# aliased `@voidzero-dev/vite-plus-core` package cannot satisfy by name even
# though it is the same release; `pnpm install` would warn on every run.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  # The tree-shaking test (`tests/tree-shaking.test.ts`) runs a real esbuild
  # bundle, so esbuild's native binary must actually be installed.
  esbuild: true
  # Only an optional perf accelerator for msgpackr (pulled in transitively by
  # the Vite+ toolchain); the pure-JS fallback is used when it isn't built.
  msgpackr-extract: false

# Supply-chain delay (owner's policy, gardeneria #1149; relaxed to 8 hours in
# #221): hold newly published versions for 480 MINUTES before pnpm will install
# them. Dependabot's `cooldown` (.github/dependabot.yml) only takes whole days,
# so it waits 1 day: longer than this, so it never proposes a version pnpm
# would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
